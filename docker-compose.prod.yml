# Production overrides: built images, no bind mounts, nginx in front, files in S3.
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Set STORAGE_BACKEND=s3 and S3_* in the production .env.
services:
  mailpit:
    profiles: ["dev-only"]

  backend:
    build:
      target: prod
    command: sh -c "python manage.py migrate --noinput && gunicorn config.wsgi:application -b 0.0.0.0:8000 -w 4 --timeout 60"
    volumes: !reset []
    ports: !reset []
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod

  worker:
    build:
      target: prod
    volumes: !reset []
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod

  frontend:
    build:
      target: prod
    command: node server.js
    volumes: !reset []
    ports: !reset []

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on: [backend, frontend]
