name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: tirek
          POSTGRES_USER: tirek
          POSTGRES_PASSWORD: tirek
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tirek" --health-interval 5s --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-secret
      # Run the suite against real Postgres, not the SQLite default of settings.test
      DATABASE_URL: postgres://tirek:tirek@localhost:5432/tirek
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y libmagic1
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
      - run: pytest --cov=apps --cov-report=term-missing
      - run: python manage.py spectacular --file openapi.yaml
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: backend/openapi.yaml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target prod -t tirek-backend backend
      - run: docker build --target prod -t tirek-frontend frontend
